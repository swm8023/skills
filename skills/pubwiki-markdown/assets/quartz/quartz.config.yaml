# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: WheelMaker Knowledge
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  # The Hub serves this site below /wiki/ and Quartz uses relative URLs where possible.
  baseUrl: localhost
  ignorePatterns:
    - .git
    - .obsidian
    - .index
    - .quartz
  defaultDateType: modified
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Inter
      body: Inter
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#fafafa"
        lightgray: "#e8e8e8"
        gray: "#b8b8b8"
        darkgray: "#4a4a4a"
        dark: "#222222"
        secondary: "#405a72"
        tertiary: "#738ca3"
        highlight: "rgba(64, 90, 114, 0.12)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#1e1e20"
        lightgray: "#3b3b3e"
        gray: "#747478"
        darkgray: "#d0d0d4"
        dark: "#eeeeef"
        secondary: "#91abc1"
        tertiary: "#9aaebd"
        highlight: "rgba(145, 171, 193, 0.16)"
        textHighlight: "#b3aa0288"

plugins:
  # Markdown and Obsidian processing is supplied by Quartz Community plugins in v5.
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80

  - source: github:quartz-community/remove-draft
    enabled: true

  # Public-site emitters. Assets, Static, and ComponentResources are built into Quartz.
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      # Search, graph, backlinks, and the WheelMaker sidebar consume this index.
      enableSiteMap: false
      enableRSS: false
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true

  # WheelMaker-owned page type and directory/tag navigation.
  - source: ./quartz/wheelmaker
    enabled: true
    order: 1000
    layout:
      position: left
      priority: 40

  # Directory navigation is supplied by Quartz Explorer and composed by WheelMaker.
  - source: github:quartz-community/explorer
    enabled: true
    options:
      title: 目录
      # The Wiki tree is a directory navigator; article cards live on the right.
      filterFn: |
        (node) => node.slugSegment !== "tags" && node.isFolder
      mapFn: |
        (node) => {
          if (node.isFolder && node.slug) {
            const folderPath = node.slug.replace(/\/index$/, "")
            const folderName = folderPath.split("/").pop() || folderPath
            Object.defineProperty(node, "displayName", {
              configurable: true,
              value: folderName,
            })
          }
        }
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10

  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links: {}

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    home:
      exclude:
        - graph
        - backlinks
      positions:
        beforeBody: []
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
