      <feComposite in="f2" in2="b2" operator="in" result="g2"/>
      <feMerge><feMergeNode in="g1"/><feMergeNode in="g2"/></feMerge>
    </filter>
    <filter id="glowOrange" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b1"/>
      <feFlood flood-color="#50230e" flood-opacity="0.7" result="f1"/>
