      <feFlood flood-color="#0044f0" flood-opacity="0.55" result="f1"/>
      <feComposite in="f1" in2="b1" operator="in" result="g1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="35" result="b2"/>
